<!DOCTYPE html>
<html lang="pt-br">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testes de Língua</title>
    <link rel="stylesheet" href="style.css">
</head>
</head>

<body>
    <h1>Teste de Conhecimentos</h1>
    <div id="quiz-container">
        <p id="question-text">A carregar pergunta...</p>
        
        <div id="fill-in-blank-container">
            <input type="text" id="user-answer" placeholder="Escreva a sua resposta">
            <button id="submit-button">Verificar</button>
        </div>

        <div id="multiple-choice-container"></div>

        <div id="construct-sentence-container">
            <div id="sentence-area"></div>
            <div id="word-bank"></div>
            <button id="check-sentence-button">Verificar</button>
            <button id="reset-sentence-button">Limpar</button>
        </div>

        <p id="feedback"></p>
    </div>
    <script src="client.js" defer></script>
</body>
</html>
