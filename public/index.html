<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extrator Inteligente de Contatos</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --primary: #25D366;
            --primary-dark: #128C7E;
            --bg-grad-1: #e0eafc;
            --bg-grad-2: #cfdef3;
            --card-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: rgba(200, 200, 200, 0.3);
        }

        body.dark-mode {
            --bg-grad-1: #0f2027;
            --bg-grad-2: #203a43;
            --card-bg: rgba(30, 35, 40, 0.75);
            --glass-border: rgba(255, 255, 255, 0.05);
            --text-main: #f5f6fa;
            --text-muted: #b2bec3;
            --input-bg: rgba(20, 25, 30, 0.8);
            --input-border: rgba(255, 255, 255, 0.1);
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            color: var(--text-main);
            transition: background 0.5s ease;
        }

        .container {
            background-color: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            animation: slideUp 0.6s ease-out;
            position: relative;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-top { display: flex; justify-content: center; align-items: center; position: relative; margin-bottom: 5px; }
        h2 { color: var(--primary-dark); margin: 0; font-size: 32px; font-weight: 600; text-align: center; }

        #theme-toggle { position: absolute; right: 0; background: none; border: none; font-size: 26px; cursor: pointer; padding: 5px; margin: 0; color: var(--text-main); transition: transform 0.2s; }
        #theme-toggle:hover { transform: scale(1.15); color: var(--primary); }

        p.subtitle { text-align: center; color: var(--text-muted); margin-bottom: 30px; font-size: 15px; line-height: 1.4; }

        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 5px; }
        .full-width { grid-column: span 2; }
        
        .filtro-destaque input {
            border-color: rgba(52, 183, 241, 0.5);
            background-color: rgba(52, 183, 241, 0.05);
            font-weight: 600;
        }

        .badge {
            display: inline-block;
            background-color: var(--primary);
            color: #fff;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 8px;
            vertical-align: middle;
            transition: background-color 0.3s;
        }
        .badge.zero { background-color: var(--text-muted); opacity: 0.5; } 
        
        @keyframes popPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.4); background-color: #8e44ad; }
            100% { transform: scale(1); }
        }
        .badge.pop { animation: popPulse 0.4s ease-out; }

        label { display: flex; align-items: center; color: var(--primary-dark); font-weight: 500; margin-bottom: 8px; font-size: 14px; gap: 6px;}
        label i { font-size: 18px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--input-bg); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--primary-dark); border-radius: 10px; border: 2px solid var(--input-bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        input[type="text"], textarea { 
            width: 100%; padding: 16px; border: 2px solid var(--input-border); border-radius: 12px;
            box-sizing: border-box; font-family: 'Poppins', sans-serif; font-size: 14px;
            background-color: var(--input-bg); color: var(--text-main); transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        input[type="text"]:focus, textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15); }
        
        textarea { height: 140px; resize: none; }
        #texto_geral { height: 160px; border-color: rgba(52, 183, 241, 0.4); } 

        .button-group-magic {
            grid-column: span 2; display: grid; grid-template-columns: 2fr 1fr; gap: 15px;
            margin-top: 5px; margin-bottom: 15px;
        }

        .button-group { grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 10px; }

        button.btn-action { 
            padding: 16px 20px; color: white; border: none; cursor: pointer; font-size: 15px; 
            font-weight: 600; border-radius: 12px; width: 100%; transition: all 0.3s ease;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        button.btn-action i { font-size: 20px; }
        
        .btn-magic { background: linear-gradient(135deg, #8e44ad, #9b59b6); box-shadow: 0 6px 15px rgba(142, 68, 173, 0.3); }
        .btn-magic:hover { box-shadow: 0 10px 25px rgba(142, 68, 173, 0.6); filter: brightness(1.1); }
        
        .btn-clear { background: linear-gradient(135deg, #e74c3c, #c0392b); box-shadow: 0 6px 15px rgba(231, 76, 60, 0.3); } 
        .btn-clear:hover { box-shadow: 0 10px 25px rgba(231, 76, 60, 0.6); filter: brightness(1.1); }
        
        .btn-csv { background: linear-gradient(135deg, #34b7f1, #2980b9); box-shadow: 0 6px 15px rgba(52, 183, 241, 0.3); }
        .btn-csv:hover { box-shadow: 0 10px 25px rgba(52, 183, 241, 0.6); filter: brightness(1.1); }
        
        .btn-vcf { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 6px 15px rgba(37, 211, 102, 0.3); }
        .btn-vcf:hover { box-shadow: 0 10px 25px rgba(37, 211, 102, 0.6); filter: brightness(1.1); }
        
        button.btn-action:active { transform: translateY(2px); }

        /* NOVO ESTILO DA ASSINATURA PREMIUM */
        .credit-footer { 
            text-align: center; 
            margin-top: 35px; 
            font-size: 14px; 
            color: var(--text-muted); 
            border-top: 1px solid var(--input-border); 
            padding-top: 20px; 
            line-height: 1.6;
        }
        .credit-footer strong { 
            color: var(--primary-dark); 
            font-weight: 600; 
            font-size: 15px;
        }
        .credit-footer .data-criacao {
            display: block;
            font-size: 12px;
            opacity: 0.7;
            margin-top: 4px;
        }

        #toast { visibility: hidden; min-width: 280px; max-width: 90%; background-color: #333; color: #fff; text-align: center; border-radius: 12px; padding: 16px 20px; position: fixed; z-index: 1000; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); font-size: 14px; opacity: 0; transition: opacity 0.3s, transform 0.3s; backdrop-filter: blur(10px); }
        #toast.show { visibility: visible; opacity: 1; transform: translateX(-50%) translateY(0); }
        #toast.success { background-color: rgba(18, 140, 126, 0.95); }
        #toast.error { background-color: rgba(231, 76, 60, 0.95); }

        @media (max-width: 768px) {
            .container { padding: 25px 20px; }
            .grid-layout, .button-group, .button-group-magic { grid-template-columns: 1fr; gap: 15px; }
            .full-width { grid-column: span 1; }
            .header-top { flex-direction: column; }
            #theme-toggle { position: relative; margin-top: 10px; }
            textarea { height: 120px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-top">
            <h2>Extrator de Contatos</h2>
            <button id="theme-toggle" onclick="toggleTheme()" title="Mudar tema"><i class="ph-fill ph-moon"></i></button>
        </div>
        <p class="subtitle">Cole o chat inteiro. O sistema separa e organiza para você com perfeição!</p>
        
        <div class="grid-layout">
            <div class="form-group">
                <label for="nome_grupo"><i class="ph-fill ph-users-three"></i> Nome do Grupo</label>
                <input type="text" id="nome_grupo" placeholder="Ex: Novos Muçulmanos">
            </div>

            <div class="form-group filtro-destaque">
                <label for="codigo_dae"><i class="ph-fill ph-key"></i> Seu Código (Filtro)</label>
                <input type="text" id="codigo_dae" value="Por-2">
            </div>

            <div class="form-group full-width">
                <label for="texto_geral">
                    <i class="ph-fill ph-clipboard-text"></i> 1. Cole TUDO misturado aqui dentro: 
                    <span id="count_total" class="badge zero">0</span>
                </label>
                <textarea id="texto_geral" placeholder="Cole o chat inteiro do WhatsApp aqui..."></textarea>
            </div>

            <div class="button-group-magic">
                <button class="btn-action btn-magic" onclick="separarContatos()"><i class="ph-fill ph-magic-wand"></i> 2. Filtrar e Separar</button>
                <button class="btn-action btn-clear" onclick="limparTudo()"><i class="ph-fill ph-trash"></i> Limpar</button>
            </div>

            <div class="form-group">
                <label for="res_masc">
                    <i class="ph-fill ph-gender-male"></i> Homens Encontrados 
                    <span id="count_masc" class="badge zero">0</span>
                </label>
                <textarea id="res_masc" placeholder="Os números vão aparecer aqui automaticamente..."></textarea>
            </div>
            
            <div class="form-group">
                <label for="res_fem">
                    <i class="ph-fill ph-gender-female"></i> Mulheres Encontradas 
                    <span id="count_fem" class="badge zero">0</span>
                </label>
                <textarea id="res_fem" placeholder="Os números vão aparecer aqui automaticamente..."></textarea>
            </div>
            
            <div class="button-group">
                <button class="btn-action btn-csv" onclick="processarExportacao('csv')"><i class="ph-fill ph-file-csv"></i> 3. Baixar Planilha</button>
                <button class="btn-action btn-vcf" onclick="processarExportacao('vcf')"><i class="ph-fill ph-address-book"></i> 3. Baixar Agenda</button>
            </div>
        </div>

        <div class="credit-footer">
            Desenvolvido com <i class="ph-fill ph-heart" style="color: #e74c3c;"></i> por <strong>Beirenesse</strong>
            <span class="data-criacao"><i class="ph-fill ph-calendar-blank"></i> Criado em: 28 de Fevereiro de 2026</span>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const inputNomeGrupo = document.getElementById('nome_grupo');
            const inputCodigo = document.getElementById('codigo_dae');
            const textoGeral = document.getElementById('texto_geral');
            
            inputNomeGrupo.value = localStorage.getItem('memoria_nome_grupo') || '';
            if (localStorage.getItem('memoria_codigo')) {
                inputCodigo.value = localStorage.getItem('memoria_codigo');
            }
            
            inputNomeGrupo.addEventListener('input', (e) => localStorage.setItem('memoria_nome_grupo', e.target.value));
            inputCodigo.addEventListener('input', (e) => localStorage.setItem('memoria_codigo', e.target.value));
            
            if(localStorage.getItem('tema_escuro') === 'sim') toggleTheme();

            textoGeral.addEventListener('input', function() {
                contarNumerosColados(this.value);
            });
        });

        function atualizarBadge(id, numero) {
            const badge = document.getElementById(id);
            if (badge.innerText != numero) {
                badge.innerText = numero;
                badge.classList.remove('pop');
                void badge.offsetWidth; 
                badge.classList.add('pop');
            }
            
            if (numero > 0) badge.classList.remove('zero');
            else badge.classList.add('zero');
        }

        function contarNumerosColados(texto) {
            const regexPhone = /\+?[\d][\d\s\-\(\)]{7,20}\d/g;
            const matches = texto.match(regexPhone) || [];
            const numerosValidos = matches.filter(m => m.replace(/\D/g, '').length >= 8);
            atualizarBadge('count_total', numerosValidos.length);
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.getElementById("theme-toggle");
            body.classList.toggle("dark-mode");
            
            if (body.classList.contains("dark-mode")) {
                btn.innerHTML = '<i class="ph-fill ph-sun"></i>';
                localStorage.setItem('tema_escuro', 'sim');
            } else {
                btn.innerHTML = '<i class="ph-fill ph-moon"></i>';
                localStorage.setItem('tema_escuro', 'nao');
            }
        }

        function mostrarNotificacao(mensagem, tipo) {
            const toast = document.getElementById("toast");
            toast.textContent = mensagem;
            toast.className = `show ${tipo}`;
            setTimeout(() => { toast.className = toast.className.replace(`show ${tipo}`, ""); }, 4000);
        }

        function limparTudo() {
            const textoGeral = document.getElementById('texto_geral');
            textoGeral.value = '';
            document.getElementById('res_masc').value = '';
            document.getElementById('res_fem').value = '';
            
            atualizarBadge('count_total', 0);
            atualizarBadge('count_masc', 0);
            atualizarBadge('count_fem', 0);

            mostrarNotificacao('🧹 Tudo limpo! Pronto para a próxima lista.', 'success');
            textoGeral.focus();
        }

        function separarContatos() {
            const codigoDae = document.getElementById('codigo_dae').value.trim().toLowerCase();
            const texto = document.getElementById('texto_geral').value;

            if (!texto.trim()) {
                mostrarNotificacao('⚠️ Cole as mensagens no quadro misturado primeiro!', 'error');
                return;
            }

            let telefonesMasc = [];
            let telefonesFem = [];

            const blocosDeFichas = texto.split(/(?=✅|\*الله)/);

            blocosDeFichas.forEach(bloco => {
                const blocoMinusculo = bloco.toLowerCase();
                if (codigoDae && !blocoMinusculo.includes(codigoDae)) return; 

                const regexPhone = /\+?[\d][\d\s\-\(\)]{7,20}\d/;
                const match = bloco.match(regexPhone);
                
                if (match) {
                    let numero = match[0].replace(/\D/g, '');
                    if (match[0].startsWith('+')) numero = '+' + numero;
                    
                    if (numero.length >= 8) {
                        if (blocoMinusculo.includes('masculino')) {
                            telefonesMasc.push(numero);
                        } else if (blocoMinusculo.includes('femenino') || blocoMinusculo.includes('feminino') || blocoMinusculo.includes('fem')) {
                            telefonesFem.push(numero);
                        }
                    }
                }
            });

            telefonesMasc = [...new Set(telefonesMasc)];
            telefonesFem = [...new Set(telefonesFem)];

            document.getElementById('res_masc').value = telefonesMasc.join('\n');
            document.getElementById('res_fem').value = telefonesFem.join('\n');

            atualizarBadge('count_masc', telefonesMasc.length);
            atualizarBadge('count_fem', telefonesFem.length);

            mostrarNotificacao(`✅ Organizado: ${telefonesMasc.length} Homens e ${telefonesFem.length} Mulheres encontrados!`, 'success');
        }

        function pegarNumeros(id) {
            return document.getElementById(id).value.split('\n').map(n => n.trim()).filter(n => n.length >= 8);
        }

        function processarExportacao(tipoExportacao) {
            let nomeGrupo = document.getElementById('nome_grupo').value.trim() || "Contato"; 
            
            const telMasc = pegarNumeros('res_masc');
            const telFem = pegarNumeros('res_fem');

            if (telMasc.length === 0 && telFem.length === 0) {
                mostrarNotificacao('⚠️ Não há contatos. Clique em "Filtrar e Separar" primeiro.', 'error');
                return;
            }

            if (tipoExportacao === 'csv') gerarCSV(telMasc, telFem, nomeGrupo);
            else gerarVCF(telMasc, telFem, nomeGrupo);

            mostrarNotificacao(`✅ Download Concluído!`, 'success');
        }

        function gerarCSV(telMasc, telFem, nomeGrupo) {
            let conteudo = "Name,Phone 1 - Value\n";
            telMasc.forEach((num, i) => conteudo += `${nomeGrupo} - Masc ${i + 1},${num}\n`);
            telFem.forEach((num, i) => conteudo += `${nomeGrupo} - Fem ${i + 1},${num}\n`);
            baixarArquivo(conteudo, `${nomeGrupo}_planilha.csv`, 'text/csv');
        }

        function gerarVCF(telMasc, telFem, nomeGrupo) {
            let conteudo = "";
            telMasc.forEach((num, i) => {
                conteudo += `BEGIN:VCARD\nVERSION:3.0\nFN:${nomeGrupo} - Masc ${i + 1}\nTEL;TYPE=CELL:${num}\nEND:VCARD\n`;
            });
            telFem.forEach((num, i) => {
                conteudo += `BEGIN:VCARD\nVERSION:3.0\nFN:${nomeGrupo} - Fem ${i + 1}\nTEL;TYPE=CELL:${num}\nEND:VCARD\n`;
            });
            baixarArquivo(conteudo, `${nomeGrupo}_agenda.vcf`, 'text/vcard');
        }

        function baixarArquivo(conteudo, nomeArquivo, tipoMime) {
            const blob = new Blob([conteudo], { type: `${tipoMime};charset=utf-8;` });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = nomeArquivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
